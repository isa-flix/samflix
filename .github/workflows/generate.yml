
name: Generate Working IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run IPTV playlist checker
        run: python3 LiveTV/generate.py

      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LiveTV/canada-usa-hindi-working.m3u

          git commit -m "Update working IPTV playlist" || echo "No changes to commit"

          git push
