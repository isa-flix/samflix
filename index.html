<head>

</head>

<body>

   <div class="navbar">
    <div class="logo">SamFlix</div>

        <div class="nav-links">

  <a href="https://isa-flix.github.io/samflix/" 
     title="Main SamFlix"
     >
     🎬Movies
  </a>

  <a href="https://isa-flix.github.io/samflix/newsam/" 
     title="NewSam">
     📺Series 
</a>

           title="Server Stream">

           title="Live TV">
           📺 LIVE TV

        <!-- SEARCH -->
        <section class="search-box" aria-label="Movie search">

            <input
                type="search"
                id="search"
                placeholder="Search movies..."
                autocomplete="off"
                aria-label="Search movies"
            >

        </section>


        <!-- MOVIE COLLECTIONS -->
        <section id="mainContainer" aria-label="Movie collections">

        </section>
</div></div>
    </main>


    <!-- VIDEO PLAYER -->
    <div id="player" role="dialog" aria-label="Video player" aria-modal="true">

        <button
            id="closeBtn"
            type="button"
            onclick="closePlayer()"
            aria-label="Close video player">
            ✖
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata"
            style="display:none;">
        </video>

        <iframe
            id="frame"
            style="display:none;"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Movie player">
        </iframe>

    </div>


    <!-- FOOTER -->
    <footer class="site-footer">
        <p>© <span id="footerYear">2026</span> SamFlix</p>
        <p>YOUR CINEMA. YOUR UNIVERSE.</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="movies.js"></script>
    <script src="app.js"></script>

    <script>
        document.getElementById("footerYear").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
