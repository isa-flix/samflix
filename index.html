
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <meta name="theme-color" content="#07070b">
    <meta name="description" content="SamFlix - Your cinematic entertainment experience.">

    <title>SamFlix | Cinema Nexus</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style02.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

   <div class="navbar">
    <div class="logo">Series</div>

        <div>

  <a href="https://isa-flix.github.io/samflix/" 
     title="Main SamFlix"
     style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
     🎬Movies
  </a>

  <a href="https://isa-flix.github.io/samflix/newsam/" 
     title="NewSam"
     style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
     📺Series
  </a>
            <a href="https://isa-flix.github.io/samflix/Oldsam/" 
           title="Server Stream"
           style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
           🖥️Server
        </a>

            <a href="https://isa-flix.github.io/samflix/LiveTV/" 
           title="Live TV"
           style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
           📺 LIVE TV
        </a>


    </div>
</div>
    <!-- CINEMATIC HERO --
    <main>

        <section class="hero" id="hero">

            <div class="hero-background" id="heroBackground"></div>

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <div class="hero-tag">
                    <span class="hero-dot"></span>
                    SAMFLIX ORIGINAL EXPERIENCE
                </div>

                <p class="hero-category" id="heroCategory">
                    FEATURED MOVIE
                </p>

                <h1 id="heroTitle">
                    THE WILD ROBOT
                </h1>

                <div class="hero-meta" id="heroMeta">
                    <span>2024</span>
                    <span>Animation</span>
                    <span>Adventure</span>
                </div>

                <p class="hero-description" id="heroDescription">
                    An unforgettable adventure about a robot
                    discovering friendship and life in the wild.
                </p>

                <div class="hero-actions">

                    <button class="watch-btn" id="heroWatch" type="button">
                        ▶ WATCH NOW
                    </button>

                    <button class="info-btn" id="heroInfo" type="button">
                        ⓘ MORE INFO
                    </button>

                </div>

            </div>

            <div class="hero-indicator">
                <span></span>
                FEATURED ON SAMFLIX
            </div>

        </section>


        <!-- SEARCH -->
        <section class="search-box" aria-label="Movie search">

            <input
                type="search"
                id="search"
                placeholder="Search movies..."
                autocomplete="off"
                aria-label="Search movies"
            >

        </section>


        <!-- MOVIE COLLECTIONS -->
        <section id="mainContainer" aria-label="Movie collections">

        </section>

    </main>


    <!-- VIDEO PLAYER -->
    <div id="player" role="dialog" aria-label="Video player" aria-modal="true">

        <button
            id="closeBtn"
            type="button"
            onclick="closePlayer()"
            aria-label="Close video player">
            ✖
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata"
            style="display:none;">
        </video>

        <iframe
            id="frame"
            style="display:none;"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Movie player">
        </iframe>

    </div>


    <!-- FOOTER -->
    <footer class="site-footer">
        <p>© <span id="footerYear">2026</span> SamFlix</p>
        <p>YOUR CINEMA. YOUR UNIVERSE.</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="movies.js"></script>
    <script src="app.js"></script>

    <script>
        document.getElementById("footerYear").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
