
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

/* ---------------- NAVBAR ---------------- */

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    position: sticky;
    top: 0;
    background: #141414;
    z-index: 900;
}

.logo {
    color: red;
    font-size: 28px;
    font-weight: bold;
}

    
body {
    margin: 0;
    background: #10131b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #191f2b;
    padding: 18px;
    text-align: center;
    font-size: 23px;
    font-weight: bold;
}

.container {
    display: flex;
    max-width: 1400px;
    margin: auto;
    padding: 15px;
    gap: 15px;
}

.player-section {
    flex: 1;
    min-width: 0;
}

video {
    width: 100%;
    background: black;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
}

#nowPlaying {
    padding: 12px 0;
    font-size: 18px;
}

.sidebar {
    width: 340px;
    background: #191f2b;
    border-radius: 10px;
    padding: 12px;
    height: 75vh;
    display: flex;
    flex-direction: column;
}

#search {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    margin-bottom: 10px;
    background: #292f3d;
    color: white;
    outline: none;
}

#channels {
    overflow-y: auto;
    flex: 1;
}

.channel {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px;
    margin-bottom: 5px;
    border-radius: 7px;
    cursor: pointer;
    background: #222938;
}

.channel:hover,
.channel.active {
    background: #3056a8;
}

.channel img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    background: #111;
    border-radius: 5px;
}

.channel-name {
    font-size: 14px;
    overflow-wrap: anywhere;
}

.status {
    color: #9ca9bd;
    font-size: 12px;
    margin-top: 10px;
}

@media(max-width: 750px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        height: 50vh;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">Live TV</div>

        <div style="position:fixed; top:10px; left:200px; z-index:9999; display:flex; gap:10px;">

  <a href="https://isa-flix.github.io/samflix/" 
     title="Main SamFlix"
     style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
     🎬Movies
  </a>

  <a href="https://isa-flix.github.io/samflix/newsam/" 
     title="NewSam"
     style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
     📺Series
  </a>
            <a href="https://isa-flix.github.io/samflix/Oldsam/" 
           title="Server Stream"
           style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
           🖥️Server
        </a>
<a href="https://isa-flix.github.io/samflix/Oldsam/" 
           title="Server Stream"
           style="padding:10px; background:#111; color:white; text-decoration:none; border-radius:50%; font-size:18px;">
           📺 LIVE TV
        </a>


    </div>
</div>



<div class="container">

    <section class="player-section">
        <video id="video" controls playsinline></video>
        <div id="nowPlaying">Select a channel to start watching</div>
        <div class="status" id="status">Ready</div>
    </section>

    <aside class="sidebar">
        <input
            id="search"
            type="text"
            placeholder="🔍 Search channels..."
        >

        <div id="channels">Loading channels...</div>
    </aside>

</div>

<script>

// =====================================
// YOUR PRIVATE PLAYLIST CONFIGURATION
// ENTER YOUR M3U URL BELOW
// =====================================

const PLAYLIST_URL = "https://iptv-org.github.io/iptv/index.category.m3u";

// =====================================

const video = document.getElementById("video");
const channelsBox = document.getElementById("channels");
const search = document.getElementById("search");
const nowPlaying = document.getElementById("nowPlaying");
const statusBox = document.getElementById("status");

let channels = [];
let hls = null;
let activeChannel = null;

async function loadPlaylist() {
    try {
        statusBox.textContent = "Loading playlist...";

        const response = await fetch(PLAYLIST_URL);

        if (!response.ok) {
            throw new Error("Playlist could not be loaded");
        }

        const data = await response.text();
        channels = parseM3U(data);

        renderChannels(channels);

        statusBox.textContent =
            channels.length + " channels available";

    } catch (error) {
        channelsBox.textContent = "Unable to load channels.";
        statusBox.textContent =
            "Playlist error: " + error.message;
    }
}

function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    const result = [];
    let current = {};

    for (const line of lines) {
        const value = line.trim();

        if (value.startsWith("#EXTINF")) {
            const name = value.split(",").pop().trim();

            const logo = value.match(/tvg-logo="([^"]*)"/);
            const group = value.match(/group-title="([^"]*)"/);

            current = {
                name: name || "Unknown Channel",
                logo: logo ? logo[1] : "",
                group: group ? group[1] : ""
            };

        } else if (value && !value.startsWith("#")) {
            if (current.name) {
                result.push({
                    ...current,
                    url: value
                });
            }

            current = {};
        }
    }

    return result;
}

function renderChannels(list) {
    channelsBox.innerHTML = "";

    if (!list.length) {
        channelsBox.textContent = "No channels found.";
        return;
    }

    list.forEach(channel => {
        const item = document.createElement("div");
        item.className = "channel";

        if (activeChannel === channel) {
            item.classList.add("active");
        }

        const logo = document.createElement("img");
        logo.src = channel.logo || "";
        logo.alt = "";
        logo.onerror = () => {
            logo.style.display = "none";
        };

        const name = document.createElement("div");
        name.className = "channel-name";
        name.textContent = channel.name;

        item.appendChild(logo);
        item.appendChild(name);

        item.addEventListener("click", () => {
            playChannel(channel);
        });

        channelsBox.appendChild(item);
    });
}

function playChannel(channel) {
    activeChannel = channel;

    nowPlaying.textContent = "▶ " + channel.name;
    statusBox.textContent = "Connecting...";

    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    if (Hls.isSupported()) {
        hls = new Hls();

        hls.loadSource(channel.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {
                statusBox.textContent =
                    "Press Play to start the channel.";
            });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                statusBox.textContent =
                    "Stream unavailable or playback error.";
                hls.destroy();
                hls = null;
            }
        });

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.url;

        video.play().catch(() => {
            statusBox.textContent =
                "Press Play to start the channel.";
        });

    } else {
        statusBox.textContent =
            "Your browser does not support this stream.";
    }

    renderChannels(
        channels.filter(channel =>
            channel.name.toLowerCase().includes(
                search.value.toLowerCase()
            )
        )
    );
}

search.addEventListener("input", () => {
    const query = search.value.toLowerCase();

    renderChannels(
        channels.filter(channel =>
            channel.name.toLowerCase().includes(query)
        )
    );
});

loadPlaylist();

</script>

</body>
</html>
